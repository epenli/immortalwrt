name: Build JDCloud RE-SS-01 clean PassWall
permissions:
  contents: read
concurrency:
  group: jdcloud-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_DIR: /mnt/jdcloud-openwrt
      CCACHE_DIR: /mnt/jdcloud-cache/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
    - name: Checkout build recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib e2fsprogs bsdextrautils \
          gettext git libncurses-dev libssl-dev python3 python3-setuptools \
          python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
          ca-certificates xz-utils zstd libelf-dev ccache cmake ninja-build \
          pkgconf bzip2 patch perl time autoconf automake libtool \
          libglib2.0-dev intltool mtools dosfstools liblzma-dev \
          u-boot-tools device-tree-compiler libfdt-dev libarchive-tools \
          liblzo2-dev help2man gperf mkbootimg android-sdk-libsparse-utils
        sudo install -d -o "$USER" -g "$(id -gn)" "$BUILD_DIR" "$CCACHE_DIR"
        mkdir -p "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/artifacts"
        df -h
    - name: Restore source download cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/jdcloud-openwrt/dl
        key: jdcloud-dl-v1-${{ runner.os }}-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          jdcloud-dl-v1-${{ runner.os }}-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-
          jdcloud-dl-v1-${{ runner.os }}-
    - name: Restore compiler cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/jdcloud-cache/ccache
        key: jdcloud-ccache-v1-ubuntu24-ipq60xx-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          jdcloud-ccache-v1-ubuntu24-ipq60xx-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-
    - name: Fetch pinned source
      run: |
        repo=$(python3 -c 'import json; print(json.load(open("jdcloud/source.json"))["repository"])')
        commit=$(python3 -c 'import json; print(json.load(open("jdcloud/source.json"))["commit"])')
        git -C "$BUILD_DIR" init
        git -C "$BUILD_DIR" remote add origin "$repo"
        git -C "$BUILD_DIR" fetch --depth 1 origin "$commit"
        git -C "$BUILD_DIR" checkout --detach FETCH_HEAD
        test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$commit"
        cp jdcloud/feeds.conf "$BUILD_DIR/feeds.conf.default"
        cp jdcloud/source.json "$GITHUB_WORKSPACE/artifacts/source.json"
        cp jdcloud/feeds.conf "$GITHUB_WORKSPACE/artifacts/feeds.conf"
    - name: Install pinned feeds and expand configuration
      run: |
        cd "$BUILD_DIR"
        ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-update.log"
        ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-install.log"
        python3 "$GITHUB_WORKSPACE/jdcloud/build.py" prepare "$BUILD_DIR"
        make defconfig 2>&1 | tee "$GITHUB_WORKSPACE/logs/defconfig.log"
        python3 "$GITHUB_WORKSPACE/jdcloud/build.py" check "$BUILD_DIR"
        cp .config "$GITHUB_WORKSPACE/artifacts/expanded.config"
        ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/artifacts/diffconfig"
        for feed in packages luci routing telephony video; do
          printf '%s %s\n' "$feed" "$(git -C "feeds/$feed" rev-parse HEAD)"
        done > "$GITHUB_WORKSPACE/artifacts/feed-commits.txt"
    - name: Fingerprint compatible toolchain inputs
      id: toolchain_key
      run: python3 build-support/toolchain-cache.py "$BUILD_DIR" jdcloud

    - name: Restore complete host tools and cross toolchain
      id: toolchain_cache
      continue-on-error: true
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          /mnt/jdcloud-openwrt/build_dir/host
          /mnt/jdcloud-openwrt/build_dir/toolchain-*
          /mnt/jdcloud-openwrt/staging_dir/host
          /mnt/jdcloud-openwrt/staging_dir/toolchain-*
        key: ${{ steps.toolchain_key.outputs.key }}

    - name: Download sources
      id: download
      run: |
        cd "$BUILD_DIR"
        make download -j8 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/download.log"
    - name: Prepare or reuse host tools and cross toolchain
      id: toolchain_build
      run: |
        cd "$BUILD_DIR"
        make -j"$(nproc)" tools/compile toolchain/compile 2>&1 | tee "$GITHUB_WORKSPACE/logs/toolchain.log"

    - name: Save complete host tools and cross toolchain
      if: steps.toolchain_build.outcome == 'success' && steps.toolchain_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          /mnt/jdcloud-openwrt/build_dir/host
          /mnt/jdcloud-openwrt/build_dir/toolchain-*
          /mnt/jdcloud-openwrt/staging_dir/host
          /mnt/jdcloud-openwrt/staging_dir/toolchain-*
        key: ${{ steps.toolchain_key.outputs.key }}

    - name: Compile firmware
      id: compile
      run: |
        cd "$BUILD_DIR"
        make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log" || {
          echo 'Parallel build failed; retrying once with detailed output.'
          make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/build-retry.log"
        }
    - name: Collect images and matching packages
      run: |
        python3 jdcloud/build.py collect "$BUILD_DIR"
    - name: Check firmware programs under ARM64 emulation
      run: |
        sudo apt-get install -y --no-install-recommends squashfs-tools qemu-user
        python3 jdcloud/check-programs.py artifacts runtime-check --geodata
    - name: Upload firmware and reproducibility metadata
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: jdcloud-re-ss-01-clean-${{ github.run_number }}
        path: artifacts/
        retention-days: 14
        if-no-files-found: error
        compression-level: 1
    - name: Save verified source downloads
      continue-on-error: true
      if: always() && !cancelled() && steps.download.outcome == 'success'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/jdcloud-openwrt/dl
        key: jdcloud-dl-v1-${{ runner.os }}-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Record compiler cache statistics
      if: always() && !cancelled() && steps.compile.outcome != 'skipped'
      run: |
        if [ -x "$BUILD_DIR/staging_dir/host/bin/ccache" ]; then
          "$BUILD_DIR/staging_dir/host/bin/ccache" --show-stats | tee "$GITHUB_WORKSPACE/logs/ccache.log"
        fi
    - name: Save compiler cache for subsequent builds
      continue-on-error: true
      if: always() && !cancelled() && steps.compile.outcome != 'skipped'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: /mnt/jdcloud-cache/ccache
        key: jdcloud-ccache-v1-ubuntu24-ipq60xx-${{ hashFiles('jdcloud/source.json', 'jdcloud/feeds.conf') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Preserve unvalidated outputs if collection fails
      if: failure() && steps.compile.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: jdcloud-re-ss-01-unvalidated-${{ github.run_number }}
        path: |
          /mnt/jdcloud-openwrt/bin/targets/qualcommax/ipq60xx/
          artifacts/
        retention-days: 14
        if-no-files-found: warn
        compression-level: 1
    - name: Upload build logs even after failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: jdcloud-re-ss-01-build-logs-${{ github.run_number }}
        path: logs/
        retention-days: 14
        if-no-files-found: warn
'on':
  workflow_dispatch: null
  push:
    branches: [main]
    paths: ['build-support/**', 'jdcloud/**', '.github/workflows/jdcloud.yml']
