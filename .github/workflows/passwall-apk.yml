name: Build PassWall APK packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['passwall/**', '.github/workflows/passwall-apk.yml']

permissions:
  contents: read

concurrency:
  group: passwall-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: PassWall APK (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: jdcloud
            recipe: jdcloud/
            cpu: ipq60xx
          - device: ufi
            recipe: ''
            cpu: msm8916
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_DIR: /mnt/${{ matrix.device }}-openwrt
      CCACHE_DIR: /mnt/${{ matrix.device }}-cache/ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      DEVICE: ${{ matrix.device }}
      RECIPE: ${{ matrix.recipe }}
    steps:
      - name: Checkout recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib e2fsprogs bsdextrautils \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates xz-utils zstd libelf-dev ccache cmake ninja-build \
            pkgconf bzip2 patch perl time autoconf automake libtool \
            libglib2.0-dev intltool mtools dosfstools liblzma-dev \
            u-boot-tools device-tree-compiler libfdt-dev libarchive-tools \
            liblzo2-dev help2man gperf qemu-user
          sudo install -d -o "$USER" -g "$(id -gn)" "$BUILD_DIR" "$CCACHE_DIR"
          mkdir -p logs artifacts
      - name: Restore source downloads
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: ${{ matrix.device }}-dl-v1-${{ runner.os }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.device }}-dl-v1-${{ runner.os }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-
            ${{ matrix.device }}-dl-v1-${{ runner.os }}-
      - name: Restore compiler cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.device }}-ccache-v1-ubuntu24-${{ matrix.cpu }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.device }}-ccache-v1-ubuntu24-${{ matrix.cpu }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-
      - name: Fetch pinned source and feeds
        run: |
          repo=$(python3 -c 'import json,os; print(json.load(open(os.environ["RECIPE"]+"source.json"))["repository"])')
          commit=$(python3 -c 'import json,os; print(json.load(open(os.environ["RECIPE"]+"source.json"))["commit"])')
          git -C "$BUILD_DIR" init
          git -C "$BUILD_DIR" remote add origin "$repo"
          git -C "$BUILD_DIR" fetch --depth 1 origin "$commit"
          git -C "$BUILD_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$commit"
          cp "${RECIPE}feeds.conf" "$BUILD_DIR/feeds.conf.default"
          cp "${RECIPE}source.json" "${RECIPE}feeds.conf" artifacts/
          cd "$BUILD_DIR"
          ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-update.log"
          ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-install.log"
      - name: Apply the matching firmware recipe
        run: |
          if [ "$DEVICE" = jdcloud ]; then
            python3 jdcloud/build.py prepare "$BUILD_DIR"
          else
            python3 scripts/prepare.py "$BUILD_DIR"
          fi
          make -C "$BUILD_DIR" defconfig 2>&1 | tee logs/defconfig.log
          if [ "$DEVICE" = jdcloud ]; then
            python3 jdcloud/build.py check "$BUILD_DIR"
          else
            python3 scripts/check-config.py "$BUILD_DIR/.config"
          fi
          grep -qx 'CONFIG_USE_APK=y' "$BUILD_DIR/.config"
          cp "$BUILD_DIR/.config" artifacts/expanded.config
          (cd "$BUILD_DIR"; ./scripts/diffconfig.sh) > artifacts/diffconfig
          for feed in "$BUILD_DIR"/feeds/*/.git; do
            directory=$(dirname "$feed")
            printf '%s %s\n' "$(basename "$directory")" "$(git -C "$directory" rev-parse HEAD)"
          done > artifacts/feed-commits.txt
      - name: Fingerprint compatible toolchain inputs
        id: toolchain_key
        run: python3 build-support/toolchain-cache.py "$BUILD_DIR" "$DEVICE"
      - name: Restore complete host tools and cross toolchain
        id: toolchain_cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
            ${{ env.BUILD_DIR }}/staging_dir/host
            ${{ env.BUILD_DIR }}/staging_dir/toolchain-*
          key: ${{ steps.toolchain_key.outputs.key }}
      - name: Prepare or reuse toolchain
        id: toolchain_build
        run: |
          cd "$BUILD_DIR"
          make -j"$(nproc)" tools/compile toolchain/compile 2>&1 | tee "$GITHUB_WORKSPACE/logs/toolchain.log"
      - name: Save complete host tools and cross toolchain
        if: steps.toolchain_build.outcome == 'success' && steps.toolchain_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.BUILD_DIR }}/build_dir/host
            ${{ env.BUILD_DIR }}/build_dir/toolchain-*
            ${{ env.BUILD_DIR }}/staging_dir/host
            ${{ env.BUILD_DIR }}/staging_dir/toolchain-*
          key: ${{ steps.toolchain_key.outputs.key }}
      - name: Fingerprint compatible package build state
        id: package_key
        run: |
          python3 passwall/test-build-cache.py
          python3 passwall/build-cache.py "$BUILD_DIR" "$DEVICE" '${{ steps.toolchain_key.outputs.key }}'
      - name: Restore Go compilation cache
        id: go_cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BUILD_DIR }}/tmp/go-build
          key: ${{ steps.package_key.outputs.go }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.package_key.outputs.go }}-
      - name: Restore exact-compatible package build state
        id: package_cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          # Keep stamps, staged dependencies and outputs together. No fallback keys.
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*
            ${{ env.BUILD_DIR }}/build_dir/hostpkg
            ${{ env.BUILD_DIR }}/staging_dir/target-*
            ${{ env.BUILD_DIR }}/staging_dir/hostpkg
            ${{ env.BUILD_DIR }}/bin
          key: ${{ steps.package_key.outputs.state }}
      - name: Rebuild current PassWall UI on a cache hit
        if: steps.package_cache.outputs.cache-hit == 'true'
        run: |
          make -C "$BUILD_DIR" package/feeds/luci/luci-app-passwall/clean
          # Explicitly remove old APKs, including translations, before collection.
          find "$BUILD_DIR/bin" -type f \( -name 'luci-app-passwall-*.apk' -o -name 'luci-i18n-passwall-*.apk' \) -delete
      - name: Build kernel prerequisites and PassWall packages only
        id: compile
        run: |
          cd "$BUILD_DIR"
          # Compile the matching kernel for kmod ABI metadata; no rootfs/image target.
          make -j"$(nproc)" target/linux/compile 2>&1 | tee "$GITHUB_WORKSPACE/logs/kernel.log" || \
            make -j1 target/linux/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/kernel-retry.log"
          # Kconfig selections are not make dependencies of an individual package.
          # PassWall 26.9.27 selects ipt2socks separately for transparent proxying.
          targets=(package/toolchain/compile package/kernel/linux/compile
                   package/feeds/luci/luci-app-passwall/compile
                   package/feeds/packages/ipt2socks/compile
                   package/feeds/packages/hysteria/compile
                   package/feeds/packages/sing-box/compile
                   package/feeds/packages/xray-core/compile
                   package/feeds/packages/geoview/compile
                   package/feeds/packages/v2ray-geodata/compile)
          make -j"$(nproc)" GO_BUILD_CACHE_DIR="$BUILD_DIR/tmp/go-build" "${targets[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/logs/packages.log" || \
            make -j1 GO_BUILD_CACHE_DIR="$BUILD_DIR/tmp/go-build" "${targets[@]}" V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/packages-retry.log"
      - name: Validate and collect installable APKs
        run: python3 passwall/collect.py "$BUILD_DIR" artifacts "$DEVICE"
      - name: Save validated package build state
        if: success() && steps.package_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.BUILD_DIR }}/build_dir/target-*
            ${{ env.BUILD_DIR }}/build_dir/hostpkg
            ${{ env.BUILD_DIR }}/staging_dir/target-*
            ${{ env.BUILD_DIR }}/staging_dir/hostpkg
            ${{ env.BUILD_DIR }}/bin
          key: ${{ steps.package_key.outputs.state }}
      - name: Save Go compilation cache
        if: always() && !cancelled() && steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BUILD_DIR }}/tmp/go-build
          key: ${{ steps.package_key.outputs.go }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload PassWall APK bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passwall-apk-${{ matrix.device }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
          compression-level: 1
      - name: Save downloads
        if: always() && !cancelled() && steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: ${{ matrix.device }}-dl-v1-${{ runner.os }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compiler cache
        if: always() && !cancelled() && steps.compile.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.device }}-ccache-v1-ubuntu24-${{ matrix.cpu }}-${{ hashFiles(format('{0}source.json', matrix.recipe), format('{0}feeds.conf', matrix.recipe)) }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passwall-apk-${{ matrix.device }}-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14

  publish:
    name: Publish verified component updates
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: passwall-apk-*
          path: bundles
      - name: Publish immutable binaries and device channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 passwall/publish-components.py bundles
